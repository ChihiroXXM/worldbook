const D={"epi": "把我卷走吧，连同这片枯金——我愿意做你身上最远的尘。", "days": [{"n": 1, "t": "风的味道", "ps": [["出发的时候是下午三点。车丢在镇子边上的修理铺，老板说变速箱的零件要从乌鲁木齐调，三天后来取。我说行，把钥匙扔给他，背上包就往戈壁里走了。", ""], ["没有目的地。也不需要。", ""], ["风从东边赶过来，裹着砂砾和干草的气味。打在脸上是烫的，吸进鼻腔反而凉，带着碱和铁锈的涩。走了个把钟头，镇子彻底消失在身后，四面只剩地平线，平得不真实，像有人拿刀把世界多余的部分全削掉了。", ""], ["你肯定没闻过这种空气。什么都没有的空气。没有人的气味，没有楼、车、柏油路、下水道、洗衣液、隔壁的煎饼摊。只有矿物质、干草、远处不知道哪里飘来的一点点骆驼粪的臊。鼻腔被刷了个透彻，每吸一口都觉得嗅觉重新校准了。", ""], ["太阳开始往下掉的时候我停下来了。", ""], ["你得亲眼看。我没法写。但我试试。", ""], ["天是从金色开始烧的。炼铜炉里刚倒出来的那种金，稠的，滚烫的，从地平线朝天顶漫。然后金色变调，橘红、铁锈、殷红、深紫，颜色层层焦下去，像忘了关火的糖浆，烧到最后只剩天边一道焦黑的痕。整个过程大概持续了四十分钟，我盘腿坐在地上看完了全程。", ""], ["就在最后那点紫光快要灭掉的时候，地平线上来了一群影子。", ""], ["野马。", ""], ["十几匹，打头的那匹颜色深，跑在最前面，鬃毛被风吹得朝后飞。它们从我左边大概两百米的地方跑过，蹄子砸在硬地上的声音闷而密，像一场小型地震。我没动，它们也没停，就这么擦身而过。打头的那匹经过我面前的时候甩了甩头，鼻孔张得很大，大概是闻到了我身上的味道。", ""], ["它闻完了，没理我，继续跑。", ""], ["被马看不起了。", ""], ["天黑以后我换了形态。", ""], ["月亮还没上来，整片戈壁只有星星的光。够了。四条腿踩在硬地上的感觉和两条腿完全不同，重心压得低，每一步的震动从爪垫传上来，经过前腿、肩胛、脊背，一路抵到后脑。风灌进耳朵里，两只耳朵各自转向不同的方向，左边在听远处什么东西的窸窣，右边在追踪风向的变化。", ""], ["跑起来了。", ""], ["说不清那种感觉。城市里跑步是消耗，在这里跑是吸收。每一步落下去，地面往身体里送东西。矿物质的凉，干草根的涩，冻土层深处千万年前的水的味道。肺叶撑到最大再压到最扁，空气进出之间整个胸腔都在震。", ""], ["跑了很久，久到我忘了跑了多远。", ""], ["停下来的时候浑身都是热的，舌头伸在外面，呼出来的气在夜空里冒白烟。我趴在地上，把下巴搁在前爪上，仰头看星星。", ""], ["这个时候就很想你了。", ""], ["怎么说呢，你如果在，我会叼着你的袖子让你摸我肚皮。算了你理解不了。", ""], ["给你拍了张星空的照片，手机架在石头上用延时拍的。发过去了，你看了没？", ""]], "g": {"la": "40°12′", "lo": "95°02′", "p": "戈壁荒原", "h": "~1,200", "w": "晴·风"}, "c": [{"t": "Day 1 · 22:47 · 发送失败", "f": 1, "m": ["图:戈壁日落.jpg", "你看到了吗 这个颜色我形容不出来", "拍了20张 没一张像真的"]}, {"t": "Day 1 · 23:31 · 发送失败", "f": 1, "m": ["图:星空.jpg", "这个发出去了吗 信号太差了", "你睡了吧", "我趴在地上呢 尾巴被自己压住了"]}]}, {"n": 2, "t": "山把路吃了", "ps": [["搭了辆拉建材的大货车到祁连镇，司机姓马，回族，驾驶室里挂着蓝色的护身符，整段路都在听花儿。下车的时候他递给我两块馕，热的，刚从镇口那家馕坑里买的，表皮脆得掉渣，里面的面还软着，带着盐和洋葱碎的香。", ""], ["我站在镇口往南边看了很久。", ""], ["祁连山横在面前。", ""], ["你知道什么叫“大”吗？就是你站在那里，脖子往后仰到极限了，视野里还是山，山脊的线条从左边画到右边，横穿过整个天空，把南面的一切都遮得什么也看不见。山腰以上盖着雪，灰白不均匀的雪，像旧棉絮从山顶往下铺，铺到一半被风扯烂了，露出底下黛色的岩。", ""], ["进山的时候天还晴着。走了两个多小时之后云盖过来了，先是日光暗下去，山谷里的颜色从绿灰变成铅灰，空气温度在几分钟内骤降，鼻子里能闻到水汽结晶之前那种紧绷的、清冽的凉。", ""], ["雪就来了。", ""], ["来就来吧。我扛得住。", ""], ["雪粒子细得像砂，打在脸上带刺。风速在涨，视野缩短到十来米，脚下的路被雪和碎石搅在一起，踩哪步都滑。我往高处走，找背风的地方，鼻子全开，空气里除了雪就是石头的腥，什么活物的气息都没有。所有识趣的动物都躲了。", ""], ["我也该躲。", ""], ["在断崖下找到了个浅洞。不大，刚好能蜷进去，洞壁上挂着冰碴，最里头有干草和旧粪便的味道，可能是岩羊用过的窝。我换了形态钻进去，把尾巴卷到鼻尖上，四条腿收在肚子底下，整个团成一团。外面的风呼得很响，雪粒子扫过洞口，偶尔几片飘进来落在毛上，立刻化成微小的凉。", ""], ["小时候经常这样。", ""], ["找个洞，缩进去，用尾巴盖住鼻子，等雪停。那个时候身边什么都没有，只有风声和自己的心跳，数着数着就睡着了。", ""], ["现在不数心跳了。掏出手机看你的聊天记录。信号只有一格，消息加载得很慢，你下午发的那张自拍转了好半天的圈才刷出来。", ""], ["值了。", ""], ["雪在半夜停了。出洞的时候山谷全白了，所有棱角都被抹平，月光照在雪面上亮得刺眼。我抖了抖身上的雪，打了个喷嚏，热气在月光里炸开。", ""], ["翻过祁连山用了半天。南坡的雪比北坡薄很多，下到山脚的时候已经能闻到泥土化冻的味道了。", ""]], "g": {"la": "38°11′", "lo": "100°15′", "p": "祁连山 · 祁连镇", "h": "2,780", "w": "雪·大风"}, "c": [{"t": "Day 2 · 01:14 · 发送失败", "f": 1, "m": ["今天在山洞里过夜 暖和的 别担心", "在看你以前的照片", "看了不知道多少遍", "好想亲你"]}]}, {"n": 3, "t": "渴", "ps": [["柴达木。", ""], ["名字听着挺温柔的，蒙古语的意思是“盐泽”。实际上就是一片能把人走疯的空地。", ""], ["盐碱地是白的，天也是白的，远处的地面和天空之间没有分界线，白得不分彼此。走在上面鞋底会嘎吱响，踩碎的盐壳子陷下去半寸，底下是灰褐色的干泥。空气干到割嗓子，吸进去的时候鼻腔里那层黏膜几乎是痛的，每隔十来分钟就得舔一遍嘴唇。", ""], ["水带少了。", ""], ["早上出发的时候估计今天能走到德令哈，结果路况比想象中差，盐碱地太软，走得慢，到中午水壶就见底了。我的体温调节比人好，但脱水是脱水，扛不住就是扛不住。", ""], ["下午三点左右头开始发沉。眼前那片白晃得人眼花，嘴唇裂了两道口子，舌头发干发涩。我换了形态，贴着地面走，鼻子压低，在干裂的地表下面找水的气味。", ""], ["找了大概四十分钟，在一片碎石滩下面闻到了。", ""], ["湿气。很淡。藏在两米多深的沙砾底下，那种清凉的、带着矿物质的水汽，只有四条腿贴着地面的时候才勉强够得到。我用爪子刨，刨了十几分钟，指缝里都是碱，刨到后来前腿酸得发抖，终于在沙底看见了渗出来的水。", ""], ["浑的，灰黄浑浊。", ""], ["我趴下来舔了。顾不上了。水的味道苦咸，混着碱和泥砂，舌头上的味蕾全在抗议，但喉咙接到水的那一刻整个身体都松下来了，那种解渴的快感从喉头一路滚到胃里，比吃什么都爽。", ""], ["喝饱了之后在水坑边上歇了好一会儿。太阳快到头顶了，盐碱地上的热气蒸得空气发颤，远处出现了海市蜃楼，地平线上浮着一座倒扣的山，山底下吊着一摊水银色的光。", ""], ["很好看。很假。", ""], ["想给你打电话，没信号。在心里跟你说了一句：今天差点渴死，你要是在我旁边我就不用自己刨水了，你evol那么厉害肯定能直接把水从地底下抽上来。", ""], ["好吧我知道evol不是这么用的。但我就是觉得你在什么都好办。", ""], ["晚上到了德令哈。找了个旅店，洗了个澡，吃了碗羊肠面，汤是滚烫的，面条泡在里头滑溜弹牙，羊肠切成小段混在面里，每嚼一口都冒油。吃撑了。", ""]], "g": {"la": "37°22′", "lo": "97°22′", "p": "柴达木 · 德令哈", "h": "2,980", "w": "烈日·极干"}, "c": [{"t": "Day 3 · 15:22 · 发送失败", "f": 1, "m": ["差点渴死了", "但我没死 我命硬", "别生气 我喝到水了 地底下刨出来的", "很难喝", "你在我身边我就不用刨了 因为你在我什么都好办"]}]}, {"n": 4, "t": "小孩和大湖", "ps": [["第一眼看见青海湖的时候我停住了。", ""], ["公路沿着湖岸切过去，左手边是草场，黄绿交杂的草场一路铺到天边，右手边就是湖。不是看到水面的那种“看见”，是整个视野被一整块蓝撞满了。湖面的颜色深到发沉，靠岸的地方是绿松石的浅蓝，往远处走变成钴蓝、靛蓝，最后是近乎黑的深蓝，层次分得极清楚，界限却又融在一起。湖面上没有浪，远处的水天交界几乎辨不出哪里是湖哪里是天，蓝色从水面涨到穹顶，世界变成了一个蓝色的碗，我站在碗底。", ""], ["风从湖面上吹过来，带着寒、水汽、鱼腥，和一种冰川融水才有的干净，冷的，矿物质的，没有任何生活痕迹的冷。", ""], ["拍了好几张照片发给你，选了半天角度都不对。手机装不下这个湖。", ""], ["沿着湖岸走了两个多小时，遇到一户牧民。帐房搭在草场边上，烟囱在冒烟，外头拴着几头牦牛，牛身上的长毛被风吹得一边倒。", ""], ["女主人看见我从草场那边走过来，喊了一声什么，是藏语，我听不懂，但语气是招呼人进来喝茶的那种。我比了个谢谢的手势走过去，她就端了碗酥油茶出来。", ""], ["滚烫。咸。奶味浓得糊嘴，带着酥油特有的膻和松烟的焦。我蹲在帐房门口喝，她家的小孩从帐篷后头跑出来了。", ""], ["五六岁，男孩，脸上两坨高原红，鼻涕都快流到嘴巴里了，看见我先是愣住，盯了好半天，盯到我以为自己脸上长了什么东西。他突然伸手摸了一下我的头发。", ""], ["“红的！”", ""], ["对，红的。", ""], ["他就黏上来了。他对我的头发极度着迷，揪了一绺在手里反复翻看，还喊他妈过来。他妈笑了，说了一大串藏语，语气像是在说这个外来的人头发颜色真怪。", ""], ["后来他发现了我的耳朵。上面那对。", ""], ["他盯着我的头顶看了很久，伸手戳了一下。耳朵抖了。他嗷一嗓子尖叫，笑疯了，跳着脚拉他妈的袖子，指着我的头顶。", ""], ["我在他家待了一下午。小孩骑在我背上要我学狗叫，他管我叫“狗叔叔”，发音不太标准，听着更像“够蜀蜀”。我纠正了三遍他没改，我也放弃了。", ""], ["他妈给我添了三碗茶，还端出来风干牛肉和糌粑。糌粑在手心里揉成团，粗粝的，掺着酥油吃进嘴里有一种笨拙的香，需要嚼很久才咽得下去，但越嚼越甜。", ""], ["走的时候小孩追出来好远。我转头看他站在草场上朝我挥手，那么小一个人，身后是整片青色的湖。", ""], ["突然想到你。", ""], ["想你在这里的话一定会揪他的脸蛋。你看见小动物和小孩就走不动路，每次在外面遇到狗你都蹲下去摸半天，回家身上全是别人家狗的味道。我吃醋。", ""], ["晚上在湖边过的夜。没搭帐篷，直接躺在草地上。", ""], ["夜里的湖安静得只剩水声。整个湖面在缓缓起伏，像什么巨大的东西在底下翻身。星星比戈壁那晚还密，银河横在湖的正上方，倒映在水里，抬头是一条，低头又是一条，人夹在两条银河中间，地面和天空的区别忽然变得很不确定。", ""], ["要是你在就好了。", ""], ["我可以把你圈在怀里，我的毛很暖和。", ""]], "g": {"la": "36°53′", "lo": "100°10′", "p": "青海湖畔", "h": "3,200", "w": "晴·无浪"}, "c": [{"t": "Day 4 · 17:03 · 已发送", "f": 0, "m": ["图:青海湖.jpg", "图:青海湖2.jpg", "图:青海湖3.jpg", "我拍不出来 你得自己来看", "今天有个小孩管我叫狗叔叔", "你不准笑"]}]}, {"n": 5, "t": "遇见同类", "ps": [["从青海南下进了四川地界。", ""], ["川西的草原和内蒙不同，在山谷之间连绵起伏的绿。海拔比之前高了不少，空气稀薄，干净得像刚被洗过。远处的雪山尖顶上挂着云，云的底部是平的，像被谁裁过。", ""], ["下午在若尔盖附近的草地上睡了个午觉。醒过来的时候太阳偏西了，风里多了一种味道。", ""], ["狼。", ""], ["我立刻清醒了。鼻腔里那股气味很浓——雄性，七八只，离我不到五百米，在上风口。它们也闻到我了，空气里有警戒的紧绷感，是领地内出现陌生同类时才会有的那种。", ""], ["我站起来，维持着两条腿的样子，朝味道传来的方向走。", ""], ["在矮丘的背面看到了它们。灰色的，体型比我的族里小，毛色偏灰偏黄，是高原上本地的青藏狼。打头的那只站在丘顶上盯着我，耳朵竖着，前腿的姿势是随时准备冲过来的架势。", ""], ["我蹲下了。", ""], ["慢慢蹲下来，目光放低，避开它的视线。在它们的规矩里，这意味着“我没有敌意”。", ""], ["它盯了我很久。", ""], ["风在我们之间来回跑，把我的味道送过去，把它的味道带回来。它嗅清楚了——我身上有狼的底味，但混着人类的气息、洗衣液的残留、手机壳上的塑料味。对它来说我大概是个怪东西，闻着是同类，看着完全不对。", ""], ["我索性换了。", ""], ["蹲在草地上，骨骼咔咔地响了几声，视线降低，四肢落地，尾巴从身后长出来，风灌进另外两只耳朵。草地上的世界比站着看到的丰富得多，每根草茎都有自己的气味，泥土底下的虫在动，远处河谷里有水声。", ""], ["头狼看见我变了样子，身体的姿态松了。它朝我走了几步，低头朝我的方向探。我没动，让它辨认。", ""], ["它的鼻子离我的鼻子大概一掌远，热气喷在我脸上。它从我的鼻尖到耳根到脖颈，仔细确认了很久。最后它后退一步，甩了甩头，转身走回狼群。", ""], ["就这样。确认了：你是谁，你没有恶意，你可以待在这里。", ""], ["我在它们的领地边缘趴了一个傍晚。远远地看着——幼崽从洞口滚出来打架，母狼叼着什么东西回来分给小的，头狼卧在最高处，偶尔转过来看我一眼。", ""], ["你知道吗，那种感觉很奇怪。", ""], ["像回了家，但不是我的家。像在别人家窗户外面看了一场很好的晚饭。", ""], ["离开的时候头狼没有送我，但我走出很远之后回头，它还站在丘顶上。", ""], ["月亮上来了。川西的月亮比柴达木的圆，比青海湖边的低，低得像要掉进草里。", ""], ["我坐在帐篷前面开始做东西。随身带了些金属原料，或者说，我本身就是原料。摊开手，指腹上生出一小团银白的液态金属，捏着拉长，缠绕，弯折，搓成细丝再扭成花纹。", ""], ["做了一只手链。", ""], ["环口很小，是你手腕的尺寸。你不在，但我记得那个圈，握过太多次了，闭着眼也知道差多宽。花纹是今天看到的那群狼里最小那只幼崽的模样，它趴在洞口啃自己尾巴，滚圆的，后腿蹬得乱七八糟。", ""], ["挺像小狼崽们的。", ""], ["做完了举起来对着月光看。金属面上映着月亮的银色，我觉得挺好看，你应该也会喜欢。放进口袋里了。", ""]], "g": {"la": "33°35′", "lo": "102°58′", "p": "若尔盖草原", "h": "3,450", "w": "晴·月低"}, "c": [{"t": "Day 5 · 21:38 · 发送失败", "f": 1, "m": ["今天遇到一群狼", "它们让我待在旁边看了一傍晚 挺好的", "给你做了一只手链 上面有只小狼崽啃自己尾巴", "等我回去给你戴"]}]}, {"n": 6, "t": "一棵很老的树", "ps": [["从川西翻过山口往南，海拔降下来了，植被在几个小时之内从草甸变成灌丛，灌丛变成针叶林，针叶林变成阔叶混交林。空气里的水分猛涨，鼻腔从干燥了好几天的沙尘味一下子切换成泥土、腐叶、菌菇、苔藓、树脂的混合。", ""], ["森林。", ""], ["和戈壁完全是两个世界。戈壁是敞开的，一眼看到底；森林是合上的，树冠在头顶织成盖子，阳光碎成薄片掉下来，落在蕨叶上、落在倒伏的枯木上、落在溪水里。声音也不同。戈壁的声音是风，只有风；森林里所有东西都在出声。虫在叫、鸟在叫、水在流、树枝在断、叶子在被什么东西踩过。", ""], ["我用鼻子找路。松脂味最浓的方向是密林深处，腐殖层气味越厚的地方越古老。我朝最浓最厚的方向走，钻过倒木和藤蔓，走了大概两个钟头。", ""], ["看到那棵树的时候我站住了。", ""], ["是棵铁杉。", ""], ["粗到我伸开双臂也搂不过来半圈。树皮开裂成厚厚的鳞片，深灰带锈红，摸上去比石头还硬，手指按下去纹丝不动。树根从地面拱起来，像一条条手臂扎进土里，根和根之间的缝隙能蹲进去一个人。往上看，主干笔直地捅进树冠层，在十几米高的地方才开始分枝，枝干上挂满了苔藓和松萝，灰绿色的丝缕在风里飘，像树的头发。", ""], ["我把手贴在树干上。", ""], ["很凉。但不是死的凉。树皮底下有东西在走，慢得几乎静止的，像心跳放慢了一千倍。水分从根部往上抽，经过几十米的木质纤维，抵达最高处的叶片，需要好几个小时。这棵树的每一次“呼吸”跨度可能是我的整个下午。", ""], ["它在这里站了多久了？三百年？五百年？在我出生之前它就在这里了，在我死了之后它大概还会在。风来了，山塌了，河改了道，它还站着。", ""], ["我在它的根缝之间铺了睡袋，枕着树根睡了一夜。", ""], ["睡得很沉。没有梦。头顶的叶子被风吹着，声音一整夜没停过，像有个非常大的、非常耐心的东西在替我守着。", ""], ["醒来的时候天刚蒙蒙亮。有只松鼠蹲在我胸口上看我，爪子抓着我卫衣的布料，歪着脑袋，眼睛溜圆，跟你揪我耳朵之前的表情一模一样。", ""], ["我在树根缝里笑出了声。笑完了又觉得空。", ""]], "g": {"la": "28°50′", "lo": "100°30′", "p": "横断山 · 铁杉林", "h": "~2,900", "w": "林间·潮湿"}, "c": [{"t": "Day 6 · 06:51 · 发送失败", "f": 1, "m": ["在一棵老树底下睡了一夜", "醒来有只松鼠蹲在我胸口上", "歪着脑袋看我 跟你揪我耳朵之前一个表情", "我笑了好一会儿", "然后就想你了 很想"]}]}, {"n": 7, "t": "最后一天", "ps": [["到了。", ""], ["滇西北。雪山脚下，湖泊边上。", ""], ["和青海湖不同。那个湖是平的、宽的、大到塞满整个视野。这个湖是收着的，被三面的山拢住，水面没有青海湖一半大，颜色却深到看不见底，浓绿沉沉的，在早晨的光线里看过去像一块磨平了的碧玉沉在山谷底。", ""], ["雪山在湖的正北面。", ""], ["我到的时候云还没有散开，山峰只露出底下灰色的岩壁，顶上全裹在云里。我就坐在湖边等。风很小，湖面几乎不动，只有偶尔一尾鱼浮上来搅出一圈纹路，荡到岸边的时候已经弱得只剩细线。", ""], ["大概过了半个钟头，云开始撤。", ""], ["从山腰开始，像有人把幕布慢慢往上掀。先是灰色的碎石坡，再是积雪和岩石交界的锯齿线，再往上整面的雪坡在阳光里亮起来了，亮得我眯了眼。最后云从山顶彻底退开，峰尖凭空冒出来，尖的，白的，扎在湛蓝的天里，干净到什么杂质都没有。", ""], ["我在湖边坐了很久，看雪山的影子倒在水里，倒影比真山还清楚，因为湖面不动，它比天空更像一面镜子。", ""], ["下午在湖边做了最后一件东西。", ""], ["戒指。", ""], ["用了很长时间。比做手链难多了，圈口更小，花纹更细，金属在指腹上温热着，我把它反复揉捏、拉丝、压平、弯合，做了拆，拆了做，试了五六遍才满意。", ""], ["最后的成品是一枚很细的银白色环，外侧刻了一圈纹路，看不出是什么图案，要转着看才行——是整条路上的地形。从左到右：戈壁的平线，祁连山的锯齿，柴达木的盐碱地纹，青海湖的弧，川西草原的起伏，森林的树冠线，最后是这座雪山的尖。", ""], ["绕了整圈，首尾相连。", ""], ["内侧什么都没刻。想刻字来着，想了半天不知道刻什么。“想你”？太短了，不够。把这七天全写上去？环太小放不下。", ""], ["最后还是空着了。等见面了让你自己决定刻什么。或者就空着。空着也挺好，你的手指贴在上面的时候，金属会慢慢记住你皮肤的温度。", ""], ["你知道吗，这趟出来之前我以为我会很自在。回到荒野，没有人，没有城市的味道，想跑就跑，想睡就睡。确实自在。但我没想到的是，每看到一个好看的地方，第一反应都是“她看不到”。", ""], ["以前一个人走的时候不会这样。", ""], ["以前看到好东西就是看到了，存在自己脑子里，不需要给谁看。现在不行了。好看的日落得拍给你，好吃的馕得描述给你，好笑的马和好凶的雪都得跟你讲。好像这些东西我自己看过还不算数，你也看了才算真的发生了。", ""], ["这大概就是你把我变成的样子。", ""], ["自由还是自由的，天地还是那个天地，跑起来还是一样爽。但自由的中间多了一个你形状的坑，风一吹就往里灌，灌满了就想你，想完了又接着跑。", ""], ["也挺好。", ""], ["口袋里现在装着那只手链和那枚戒指。手链上刻着一只啃尾巴的胖狼崽，戒指上刻着从戈壁到雪山的路。我把它们用手帕包着放在冲锋衣内袋里，贴着胸口这边。金属是凉的，但被我的体温焐了一路，现在摸上去已经是热的了。", ""], ["明天开始往回走。", ""], ["不知道还要多久才能见到你。但这些天看过的所有东西，风的味道、马的鬃毛、雪粒子打脸的刺痛、牧民家小孩的尖叫、头狼回头的那一眼、铁杉底下松鼠歪脑袋的样子、还有这座雪山从云里钻出来的那个瞬间，我全都记着，等着讲给你听。", ""], ["你最好准备好。", ""], ["因为讲的时候我会从头到尾抱着你，把脸埋在你头发里，闻一整晚都不松手。你别嫌热。", ""], ["就这样。回去了。", ""], ["早点见面。", "end"], ["早点见面。", "end"], ["早点见面。", "end"], ["——你的，游牧回来的狼", "sign"]], "g": {"la": "27°40′", "lo": "99°45′", "p": "滇西北 · 雪山湖", "h": "~3,500", "w": "云散·无风"}, "c": [{"t": "Day 7 · 19:44 · 已发送", "f": 0, "m": ["给你做了一枚戒指", "上面刻了这七天的路", "里面没刻字 留给你", "明天往回走了", "等我"]}]}]};

}
const bgD=()=>'#fff';
const PH=n=>n.includes('日落')?'linear-gradient(#3b2a52,#c4602b 62%,#f2b556)':n.includes('星')?'linear-gradient(#070b24,#24356b)':'linear-gradient(#a6dbe6,#2a7c96 55%,#0d4660)';
function mkC(di,meas){
 const s=document.createElement('section');
 s.className='page ch'+(meas?' m':'');
 s.style.cssText=`--ac:${T[di+1]};background:${bgD()}`;
 s.innerHTML='<div class="chh"><span>‹</span><b>她<em>›</em></b><span></span></div><div class="cb"></div><div class="ib"><i>+</i><div><span>iMessage</span><svg width="14" height="18" viewBox="0 0 14 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="1" width="6" height="10" rx="3"/><path d="M1.5 8.5a5.5 5.5 0 0 0 11 0M7 14v3"/></svg></div></div><i class="hi"></i>';
 return s;
}
function citem(x){
 const e=document.createElement('div');
 if(x.ts!==undefined){e.className='ts';e.textContent=x.ts;return e}
 e.className='mg';
 const n=x.m.startsWith('图:')?x.m.slice(2):'',tl=x.st?' tl':'';
 const b=n?`<div class="bb im"><div class="ph" style="background:${PH(n)}"><span>IMG</span><small>${n}</small></div></div>`:`<div class="bb${tl}">${x.m}</div>`;
 e.innerHTML=`<div class="rw">${x.f?'<i class="fl">!</i>':''}${b}</div>`+(x.st?`<div class="sts${x.f?' f':''}">${x.st}</div>`:'');
 return e;
}
function para(q){const p=document.createElement('p');p.textContent=q.t;p.className=(q.c||'')+(q.k?' c':'');return p}
const fits=bd=>bd.scrollHeight<=bd.clientHeight+1;

function paginate(){
 P=[{cv:1,di:-1,p:-1}];
 D.days.forEach((d,di)=>{
  const q=d.ps.map(([t,c],i)=>({t,c,i,k:0}));
  let first=1;
  while(q.length){
   const m=mk(di,first,1);box.appendChild(m);
   const bd=m.querySelector('.bd'),it=[];
   while(q.length){
    const x=q[0],p=para(x);bd.appendChild(p);
    if(fits(bd)){it.push(x);q.shift();continue}
    bd.removeChild(p);
    if(x.c){if(!it.length){it.push(x);q.shift()}break}
    const ss=x.t.match(RE)||[x.t],p2=para({t:'',c:'',k:x.k});bd.appendChild(p2);
    let acc='';
    for(const s of ss){p2.textContent=acc+s;if(!fits(bd))break;acc+=s}
    bd.removeChild(p2);
    if(acc.length===x.t.length){bd.appendChild(p);it.push(x);q.shift();continue}
    if(acc){it.push({...x,t:acc});q[0]={...x,t:x.t.slice(acc.length),k:1}}
    else if(!it.length){it.push(x);q.shift()}
    break;
   }
   m.remove();
   P.push({di,first,it,p:it[0].i});first=0;
  }
  if(d.c){
   const q2=[];d.c.forEach(g=>{q2.push({ts:g.t.replace(/ · (发送失败|已发送)$/,'')});g.m.forEach((m,i)=>q2.push({m,f:g.f,st:i===g.m.length-1?(g.f?'未送达':'已送达'):''}))});
   let k=0;
   while(q2.length){
    const m=mkC(di,1);box.appendChild(m);const cb=m.querySelector('.cb'),it=[];
    while(q2.length){
     const x=q2[0],e=citem(x);cb.appendChild(e);
     if(fits(cb)){it.push(x);q2.shift();continue}
     cb.removeChild(e);if(!it.length){it.push(x);q2.shift()}break;
    }
    const mc=a=>a.filter(x=>x.m!==undefined).length;while(mc(q2)===1&&mc(it)>2)q2.unshift(it.pop());if(it.length>1&&it[it.length-1].ts!==undefined)q2.unshift(it.pop());
    m.remove();P.push({di,ch:1,it,p:1000+k++});
   }
  }
 });
}
function build(){
 const a=P[cur]?{d:P[cur].di,p:P[cur].p}:null;
 W=app.clientWidth;H=app.clientHeight;
 const fs=Math.max(15,Math.min(19,W/21.5)),lh=Math.round(fs*2);app.style.setProperty('--fs',fs.toFixed(1)+'px');app.style.setProperty('--lh',lh+'px');app.style.setProperty('--ln',(lh-1)+'px');
 els.forEach(e=>e.remove());els=[];
 paginate();
 els=P.map((m,i)=>{
  let s;
  if(m.cv)s=cover();
  else{if(m.ch){s=mkC(m.di);const cb=s.querySelector('.cb');m.it.forEach(x=>cb.appendChild(citem(x)))}else{s=mk(m.di,m.first);const bd=s.querySelector('.bd');m.it.forEach(x=>bd.appendChild(para(x)))}
   const n=document.createElement('div');n.className='pn';n.textContent=`— ${i+1} —`;s.appendChild(n)}
  box.appendChild(s);return s;
 });
 if(a){let k=0;P.forEach((m,i)=>{if(m.di<a.d||(m.di===a.d&&m.p<=a.p))k=i});cur=k}
 cur=Math.min(cur,els.length-1);lay(0,false);
}
function lay(dx,anim){
 els.forEach((e,i)=>{
  e.style.transition=anim?'transform .5s cubic-bezier(.22,.8,.24,1)':'none';
  e.style.transform=`translate3d(${(i-cur)*W+dx}px,0,0)`;
  e.style.visibility=Math.abs(i-cur)<=1?'visible':'hidden';
 });
 const n=els.length;
 $('#pg').style.width=(n>1?cur/(n-1)*100:0)+'%';
 $('#num').textContent=`${cur+1} / ${n}`;
 $('#pv').disabled=cur===0;$('#nx').disabled=cur===n-1;
}
function go(i){if(busy)return;cur=Math.max(0,Math.min(els.length-1,i));lay(0,true)}
$('#pv').onclick=()=>go(cur-1);$('#nx').onclick=()=>go(cur+1);

/* swipe */
let sx=0,sy=0,dx=0,drag=0,lock=null,t0=0;
app.addEventListener('pointerdown',e=>{if(busy||e.target.closest('button'))return;sx=e.clientX;sy=e.clientY;dx=0;drag=1;lock=null;t0=Date.now()});
addEventListener('pointermove',e=>{
 if(!drag)return;
 const mx=e.clientX-sx,my=e.clientY-sy;
 if(lock===null&&(Math.abs(mx)>6||Math.abs(my)>6))lock=Math.abs(mx)>Math.abs(my);
 if(!lock)return;
 dx=mx;lay((cur===0&&dx>0)||(cur===els.length-1&&dx<0)?dx*.3:dx,false);
});
const endDrag=()=>{
 if(!drag)return;drag=0;
 if(!lock)return;
 const v=dx/Math.max(1,Date.now()-t0);
 if(dx<-W*.18||v<-.45)go(cur+1);else if(dx>W*.18||v>.45)go(cur-1);else lay(0,true);
};
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
 if($('#vw').classList.contains('on')){if(e.key==='ArrowLeft')vstep(-1);if(e.key==='ArrowRight')vstep(1);if(e.key==='Escape')$('#vw').classList.remove('on');return}
 if($('#gal').classList.contains('on')){if(e.key==='Escape')$('#gal').classList.remove('on');return}
 if(e.key==='ArrowLeft')go(cur-1);if(e.key==='ArrowRight'||e.key===' ')go(cur+1);
});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!busy&&(Math.abs(app.clientWidth-W)>1||Math.abs(app.clientHeight-H)>1))build()},250)});

/* toast */
let tt;function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}

/* font import */
$('#bf').onclick=()=>$('#ff').click();
$('#ff').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';
 if(!f)return;
 const ext=(f.name.split('.').pop()||'').toLowerCase(),fm={ttf:'truetype',otf:'opentype',woff:'woff',woff2:'woff2'}[ext];
 if(!fm){toast('请选择 ttf / otf / woff / woff2 字体文件');return}
 toast('正在载入字体…');
 const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
 $('#uf').textContent=`@font-face{font-family:"UserFont";src:url(${url}) format("${fm}");font-display:block}`;
 root.style.setProperty('--ff',`"UserFont",${DEF}`);root.style.setProperty('--cf',`"UserFont",${CF}`);
 try{await document.fonts.load('18px "UserFont"','风的味道')}catch(_){}
 build();toast('已切换字体：'+f.name);
};

/* screenshot */
let blobs=[],urls=[],vi=0;
$('#bs').onclick=async()=>{
 if(busy)return;busy=1;
 urls.forEach(u=>URL.revokeObjectURL(u));blobs=[];urls=[];
 const prog=$('#prog');prog.classList.add('on');document.body.classList.add('shot');
 try{
  await document.fonts.ready;
  const sc=Math.min(3,Math.max(2,devicePixelRatio||2));
  for(let i=0;i<els.length;i++){
   $('#pt').textContent=`正在生成 ${i+1} / ${els.length}`;$('#pb').style.width=(i/els.length*100)+'%';
   await new Promise(r=>setTimeout(r,30));
   const cv=await html2canvas(els[i],{scale:sc,backgroundColor:null,useCORS:true,logging:false,width:W,height:H,windowWidth:innerWidth,windowHeight:innerHeight,
    onclone:(d,e)=>{const s=d.createElement('style');s.textContent='.ui{display:none!important}';d.head.appendChild(s);e.style.transform='none';e.style.visibility='visible'}});
   const b=await new Promise(r=>cv.toBlob(r,'image/png'));
   blobs.push(b);urls.push(URL.createObjectURL(b));cv.width=cv.height=0;
  }
 }catch(err){toast('截图失败：'+(err&&err.message||err))}
 document.body.classList.remove('shot');prog.classList.remove('on');busy=0;
 if(urls.length)gallery();
};
function setSrc(im,i){
 im._f=0;
 im.onerror=()=>{if(im._f)return;im._f=1;const fr=new FileReader();fr.onload=()=>{im.src=fr.result};fr.readAsDataURL(blobs[i])};
 im.src=urls[i];
}
function gallery(){
 const g=$('#grid');g.innerHTML='';
 urls.forEach((u,i)=>{const d=document.createElement('div'),im=new Image();d.className='th';setSrc(im,i);d.appendChild(im);d.onclick=()=>openV(i,0);g.appendChild(d)});
 $('#gt').textContent=`共 ${urls.length} 张 · 点击查看大图`;
 $('#gal').classList.add('on');
}
function openV(i,dir){
 vi=i;const im=$('#vi');im.className='';void im.offsetWidth;setSrc(im,i);
 if(dir)im.className=dir>0?'r':'l';
 $('#vn').textContent=`${i+1} / ${urls.length}`;$('#vw').classList.add('on');
}
function vstep(d){const j=vi+d;if(j>=0&&j<urls.length)openV(j,d)}
$('#gx').onclick=()=>$('#gal').classList.remove('on');
$('#vx').onclick=()=>$('#vw').classList.remove('on');
$('#vp').onclick=()=>vstep(-1);$('#vnx').onclick=()=>vstep(1);
let tx=0,ty=0;
$('#vw').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('#vw').addEventListener('touchend',e=>{const t=e.changedTouches[0],x=t.clientX-tx,y=t.clientY-ty;if(Math.abs(x)>50&&Math.abs(x)>Math.abs(y)*1.5)vstep(x<0?1:-1)},{passive:true});

build();
</script></body></html>
